<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somatic Artificial Intelligence Laboratory (SAIL) | Georgia Southern University</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="global.css">

    <script src="components/load-nav-footer.js" type="module" defer></script>
</head>

<body class="bg-gray-50 text-gray-800 antialiased selection:bg-gsuGold selection:text-gsuNavy">

    <div class="w-screen min-h-screen">
        <div id="nav-insert"></div>

        <section id="events" class="pt-10 pb-20">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                <div class="text-center mb-12">
                    <h2 class="text-3xl font-bold text-gsuNavy uppercase tracking-wide">Collaborations</h2>
                    <div class="h-1 w-20 bg-gsuGold mx-auto mt-4 rounded"></div>
                </div>

                <div class="space-y-10">

                    <!-- Internal Collaborations -->
                    <div class="bg-white rounded-xl shadow border-l-4 border-gsuNavy">
                        <div class="p-8 pb-4 border-b shrink-0 flex items-center gap-3">
                            <i class="fa-solid fa-building-columns text-gsuNavy text-xl"></i>
                            <h3 class="text-xl font-bold text-gray-900">Internal Collaborations</h3>
                        </div>
                        <div class="p-8 pt-6 space-y-4">

                            <div class="flex items-start gap-4 p-5 rounded-lg border border-gray-100 hover:shadow-md transition">
                                <div class="bg-gsuNavy text-white p-3 rounded-full flex-shrink-0">
                                    <i class="fa-solid fa-flask"></i>
                                </div>
                                <div>
                                    <a href="https://sites.google.com/georgiasouthern.edu/visionary"
                                        target="_blank"
                                        class="font-bold text-gsuNavy hover:underline text-lg">
                                        VISIONARY Laboratory
                                    </a>
                                    <p class="text-sm text-gray-600 mt-1">Visual Simulation, Interaction & Neuro-Adaptive Research Yielding Intelligent Interaction — Georgia Southern University</p>
                                </div>
                            </div>

                            <div class="flex items-start gap-4 p-5 rounded-lg border border-gray-100 hover:shadow-md transition">
                                <div class="bg-gsuNavy text-white p-3 rounded-full flex-shrink-0">
                                    <i class="fa-solid fa-warehouse"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-gsuNavy text-lg">ROWS Laboratory</h4>
                                    <p class="text-sm text-gray-600 mt-1">Remotely Operated Warehouse Services — Georgia Southern University</p>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- International Collaborators -->
                    <div class="bg-white rounded-xl shadow border-l-4 border-gsuGold">
                        <div class="p-8 pb-4 border-b shrink-0 flex items-center gap-3">
                            <i class="fa-solid fa-globe text-gsuGold text-xl"></i>
                            <h3 class="text-xl font-bold text-gray-900">International Collaborators</h3>
                        </div>
                        <div class="p-8 pt-6 grid grid-cols-1 md:grid-cols-2 gap-6" id="collaborators-cont">
                            <!-- JavaScript inserts here -->
                        </div>
                    </div>

                </div>
            </div>
        </section>

    </div>

    <div id="footer-insert"></div>

    <script>
        const collaborators = [
            {
                name: "Dr. Sibi Chakkaravarthy",
                title: "Professor, School of Computer Science and Engineering (SCOPE)",
                org: null,
                location: null,
                areas: ["Network Security", "Targeted Cyber Attacks", "Advanced Persistent Threats", "Malware Analysis"],
                icon: "fa-user-shield"
            },
            {
                name: "Dr. Karthikeyan Saminathan",
                title: "Chief AI Officer and CTO",
                org: "Heuristic Labs",
                location: "Chennai, India",
                areas: ["Artificial Intelligence", "Gen AI", "Network Security", "Wireless Networks", "Cryptography", "Sustainable Computing", "Machine Learning"],
                icon: "fa-brain"
            },
            {
                name: "Dr. Usha G",
                title: "Professor",
                org: "SRM University",
                location: null,
                areas: ["Network Security", "Wireless Networks", "Cryptography", "Sustainable Computing", "Machine Learning"],
                icon: "fa-chalkboard-user"
            },
            {
                name: "Mirakle Integrative Healthcare Centre",
                title: "Healthcare Collaborator",
                org: "Mirakle Integrative Healthcare Centre",
                location: "Pollachi, India",
                areas: ["Integrative Healthcare", "Clinical Research"],
                icon: "fa-hospital"
            },
        ];

        const collaboratorsCont = document.querySelector("#collaborators-cont");
        collaborators.forEach(collab => {
            const areas = collab.areas.map(a =>
                `<span class="inline-block text-xs bg-gray-100 text-gray-700 rounded-full px-2 py-1">${a}</span>`
            ).join("");

            collaboratorsCont.innerHTML += `
<div class="flex items-start gap-4 p-5 rounded-lg border border-gray-100 hover:shadow-md transition">
    <div class="bg-gsuGold text-white p-3 rounded-full flex-shrink-0">
        <i class="fa-solid ${collab.icon}"></i>
    </div>
    <div>
        <h4 class="font-bold text-gsuNavy text-lg">${collab.name}</h4>
        <p class="text-sm font-semibold text-gray-700">${collab.title}</p>
        ${collab.org ? `<p class="text-sm text-gray-500">${collab.org}${collab.location ? ` &mdash; ${collab.location}` : ""}</p>` : ""}
        ${collab.location && !collab.org ? `<p class="text-sm text-gray-500">${collab.location}</p>` : ""}
        <div class="flex flex-wrap gap-2 mt-3">
            ${areas}
        </div>
    </div>
</div>
`;
        });
    </script>

</body>

</html>
